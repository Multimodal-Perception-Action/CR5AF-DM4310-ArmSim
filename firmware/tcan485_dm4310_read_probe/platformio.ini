[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.11.0
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
upload_port = COM6
monitor_port = COM6
board_build.partitions = huge_app.csv

[env:esp32dev_legacy]
extends = env:esp32dev
build_flags = -DGRIPPER_LEGACY_PROFILE=1
