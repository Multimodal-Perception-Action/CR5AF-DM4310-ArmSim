<text x="88" y="968" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">• 确认 CAN 两端各一个 120Ω</text>
<text x="88" y="1004" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">• 不允许 24V 直接进 XIAO</text>
<rect x="65" y="1086" width="1775" height="90" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
<text x="88" y="1122" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#92400E" text-anchor="start">重要：</text>
<text x="160" y="1122" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#92400E" text-anchor="start">非隔离 SP3485 需要共同信号参考；电机大电流必须走独立电源回路，不可经 M8 红线回流。</text>
<text x="88" y="1155" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#92400E" text-anchor="start">USB 调试时应隔离外部 5V，避免双电源反灌；控制板还需编写 Modbus RTU 从站 → 达妙 CAN 的协议转换程序。</text>
